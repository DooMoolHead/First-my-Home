<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밍짜네 집들이 초대장</title>
<meta property="og:title" content="밍짜네 집들이 초대장">
<meta property="og:description" content="민주 & 찬호가 이사했어요. 되는 날 골라주세요!">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
:root{--paper:#f7f1e6; --paper-2:#efe6d5; --card:#fffaf1; --ink:#2b2621; --ink-2:#7a6e60; --line:#d9ccb6; --no:#c8442b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper-2); color:var(--ink); font-family:'Gowun Dodum',system-ui,'Apple SD Gothic Neo',sans-serif; font-size:15px; line-height:1.7; word-break:keep-all; -webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.sheet{max-width:440px; margin:0 auto; min-height:100vh; background:var(--paper); padding:0 24px 40px;
}
.kicker{font-family:'Gowun Batang',serif; letter-spacing:.32em; font-size:11px; color:var(--ink-2); text-align:center; margin:0 0 14px; padding-top:56px}
h1{font-family:'Gowun Batang',serif; font-weight:700; font-size:30px; line-height:1.3; text-align:center; margin:0}
h1 small{display:block; font-size:15px; font-weight:400; color:var(--ink-2); margin-top:8px}
.rule{display:flex; align-items:center; gap:10px; margin:44px 0 26px; color:var(--ink-2); font-size:12px; font-family:'Gowun Batang',serif; letter-spacing:.1em}
.rule::before,.rule::after{content:""; flex:1; height:1px; background:var(--line)}

.nos{list-style:none; margin:0; padding:0; display:grid; gap:22px}
.nos li{display:grid; grid-template-columns:64px 1fr; column-gap:0; align-items:last baseline}
.nos .no{font-family:'Gowun Batang',serif; font-weight:700; color:var(--no); font-size:34px; line-height:40px; letter-spacing:-.02em}
.nos b{font-family:'Gowun Batang',serif; font-size:21px; line-height:40px}
.nos .su{grid-column:1/-1; margin:12px 0 0; background:#fff; padding:6px; box-shadow:0 2px 8px rgba(60,40,10,.12); transform:rotate(-1.2deg)}
.nos .su img{display:block; width:100%; aspect-ratio:1; object-fit:cover; object-position:64% 62%}
.nos .mem div{display:flex; gap:3px; align-items:flex-start}
.nos .mem img{flex:var(--r) 1 0; min-width:0; width:0; height:auto; aspect-ratio:var(--r); object-fit:cover}
.nos .su figcaption{font-size:11.5px; color:var(--ink-2); text-align:center; padding-top:4px}
.nos li > span:not(.no){grid-column:2; font-size:13px; line-height:20px; color:var(--ink-2)}

.letter{font-family:'Nanum Pen Script',cursive; font-size:23px; line-height:36px; margin:0; color:#3a3129; padding-top:6px;
  background:repeating-linear-gradient(180deg,transparent 0 35px,var(--line) 35px 36px)}
.letter .sign{display:block; text-align:right; margin-top:8px}
.gallery{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.gallery img{width:100%; aspect-ratio:1; object-fit:cover; display:block}

.center{text-align:center}
.lead{font-family:'Gowun Batang',serif; font-size:20px; font-weight:700; margin:0}
.muted{color:var(--ink-2); font-size:13.5px; margin:4px 0 0}

/* 폼 */
.rv-form{display:grid; gap:18px; margin-top:22px}
.rv-field{display:grid; gap:8px; margin:0}
.rv-label{font-family:'Gowun Batang',serif; font-size:14px; font-weight:700}
.rv-hint{font-size:12.5px; color:var(--ink-2); margin:0}
.rv-form input[name=name],.rv-form input[name=message],.rv-car{width:100%; min-height:46px; padding:0 12px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink); font:inherit; font-size:16px}
.rv-seg,.rv-chips{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.rv-seg label,.rv-chips label{position:relative}
.rv-seg input,.rv-chips input{position:absolute; opacity:0; pointer-events:none}
.rv-seg span,.rv-chips span{display:flex; align-items:center; justify-content:center; min-height:46px; border:1px solid var(--line); border-radius:4px; background:var(--card); font-size:14px; cursor:pointer}
.rv-seg input:checked + span{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.rv-chips input:checked + span{border-color:var(--no); color:var(--no); background:#fbeee6; font-weight:700}
.rv-chips input:checked + span::before{content:"✓ "}
.rv-step{display:flex; align-items:center; width:max-content; border:1px solid var(--line); border-radius:4px; background:var(--card)}
.rv-step button{width:46px; height:44px; border:0; background:none; font-size:20px; color:var(--ink); cursor:pointer}
.rv-step output{min-width:52px; text-align:center}
.rv-err{color:var(--no); font-size:13px; margin:0}
.rv-err:empty{display:none}
.rv-submit{min-height:54px; border:0; border-radius:4px; background:var(--ink); color:var(--paper); font-family:'Gowun Batang',serif; font-size:17px; font-weight:700; cursor:pointer}
.rv-submit:disabled{opacity:.6}
.rv-preview{font-size:12px; color:var(--ink-2); text-align:center; margin:-8px 0 0}

/* 결과 */
.results{margin-top:30px; padding:20px 18px; background:var(--card); border:1px solid var(--line); border-radius:4px; scroll-margin-top:16px}
.rv-bars{display:grid; gap:10px}
.rv-bar{display:grid; grid-template-columns:96px 1fr 24px; align-items:center; gap:10px; font-size:13.5px}
.rv-bar-t{height:10px; background:var(--paper-2); border-radius:5px; overflow:hidden}
.rv-bar-t i{display:block; height:100%; background:var(--ink-2); border-radius:5px; transition:width .5s}
.rv-bar.is-best .rv-bar-t i{background:var(--no)}
.rv-bar.is-major .rv-bar-l{color:var(--no); font-weight:700}
.rv-bar-n{text-align:right; font-variant-numeric:tabular-nums}
.rv-sum{font-size:13px; color:var(--ink-2); margin:14px 0 0}
.rv-sum b{color:var(--no)}
.rv-people{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line)}
.rv-sub{font-size:13.5px; margin:0 0 8px}
.rv-sub b{color:var(--no)}
.rv-names{list-style:none; margin:0 0 14px; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.rv-names li{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:2px 11px; font-size:13.5px}
.rv-names em{display:block; font-style:normal; font-size:11.5px; color:var(--ink-2)}
.rv-names small{color:var(--no)}
.rv-cars{list-style:none; margin:0 0 6px; padding:0; font-size:13.5px}
.rv-cars li{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dotted var(--line)}
.rv-cars code{font-family:inherit; letter-spacing:.06em}
.rv-no{color:var(--ink-2); margin-top:12px}
.rv-empty{border:0!important; background:none!important; color:var(--ink-2); padding:0!important}

.addr{font-family:'Gowun Batang',serif; font-size:18px; font-weight:700; margin:0}
.btns{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:16px}
.btn{display:flex; align-items:center; justify-content:center; min-height:44px; padding:0 8px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink); font:inherit; font-size:13.5px; text-decoration:none; cursor:pointer}
.facts{margin:20px 0 0; display:grid; grid-template-columns:52px 1fr; row-gap:10px; font-size:14.5px}
.facts dt{color:var(--ink-2)} .facts dd{margin:0}
.share{margin-top:48px; display:grid; gap:8px}
footer{margin-top:28px; text-align:center; font-size:12px; color:var(--ink-2)}
.toast{position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:20px; font-size:13px; transition:.25s; pointer-events:none; z-index:9}
.toast.show{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="sheet">
  <p class="kicker">HOUSEWARMING · 2027</p>
  <h1>밍짜네 집들이 초대장<small>우리, 이사했어요</small></h1>

  <div class="rule">세 가지 약속</div>
  <ul class="nos">
    <li><span class="no">No!</span><b>집들이 선물</b><span>두 손은 가볍게, 추억은 파멸적으로</span><figure data-group class="su mem"><div><img style="--r:0.75" src="photos/memory-1.jpg" alt="추억 사진 1 (모자이크)" loading="lazy"><img style="--r:0.685" src="photos/memory-2.jpg" alt="추억 사진 2 (모자이크)" loading="lazy"><img style="--r:0.75" src="photos/memory-3.jpg" alt="추억 사진 3 (모자이크)" loading="lazy"><img style="--r:0.75" src="photos/memory-4.jpg" alt="추억 사진 4 (모자이크)" loading="lazy"></div></figure></li>
    <li><span class="no">No!</span><b>수 아들</b><span>마음도 편하게</span><figure class="su"><img src="photos/no-su-adeul.jpg" alt="수 아들 사진 (얼굴 모자이크)" loading="lazy"></figure></li>
    <li><span class="no">No!</span><b>칼부림</b><span>이번 집에 러그는 없어요</span><figure data-group class="su mem knife"><div><img style="--r:0.75" src="photos/knife-1.jpg" alt="칼부림 장난 사진 1" loading="lazy"><img style="--r:0.565" src="photos/knife-2.jpg" alt="칼부림 장난 사진 2" loading="lazy"><img style="--r:0.75" src="photos/knife-3.jpg" alt="칼부림 장난 사진 3" loading="lazy"></div><figcaption>태섭이가 죽을까봐 러그를 안깔았어요</figcaption></figure></li>
  </ul>

  <div class="rule">초대말</div>
  <p class="letter">
    드디어 우리 집이 생겼어요.<br>
    아직 짐 정리는 덜 됐지만,<br>
    제일 먼저 보여주고 싶은 사람들을 불러요.<br>
    요리는 잘 하는데 귀찮으니까 배달로 거하게 쏠게요.
    <span class="sign" id="sign"></span>
  </p>

  <div id="gallWrap" hidden><div class="rule">우리 집</div><div class="gallery" id="gallery"></div></div>

  <div class="rule" id="whenRule">언제 올래?</div>
  <section>
    <div class="center">
      <p class="lead" id="whenLead"></p>
      <p class="muted" id="whenSub"></p>
    </div>
    <div id="form"></div>
    <div class="results" id="results"></div>
  </section>

  <div class="rule">오시는 길</div>
  <section>
    <p class="addr" id="unit"></p>
    <p class="muted" id="road"></p>
    <div class="btns">
      <a class="btn" id="kakaoMap" target="_blank" rel="noopener">카카오맵</a>
      <a class="btn" id="naverMap" target="_blank" rel="noopener">네이버지도</a>
      <button class="btn" type="button" id="copyAddr">주소 복사</button>
    </div>
    <dl class="facts">
      <dt>주차</dt><dd id="parking"></dd>
      <dt>메뉴</dt><dd id="menu"></dd>
    </dl>
  </section>

  <div class="share"><button class="btn" type="button" id="copyLink">초대장 링크 복사</button></div>
  <footer id="foot"></footer>
</main>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="rsvp.js"></script>
<script src="form.js"></script>
<script src="lightbox.js"></script>
<script>
const C = INVITE, $ = id => document.getElementById(id);
const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600); };
$('sign').textContent = `— ${C.hosts.join(' & ')}`;
$('foot').textContent = `${C.hosts.join(' · ')} · 동탄`;
if (C.photos.gallery.length) { $('gallWrap').hidden = false; $('gallery').innerHTML = C.photos.gallery.map(p => `<img src="photos/${p}" alt="" loading="lazy">`).join(''); }
const time = `${RSVP.fmt.time(C.start)} ~ ${RSVP.fmt.time(C.end)}`;
if (C.confirmedDate) { $('whenRule').textContent = '언제'; $('whenLead').textContent = RSVP.fmt.mdw(C.confirmedDate); $('whenSub').textContent = time; }
else { $('whenLead').textContent = '3월 토요일 중 하루'; $('whenSub').textContent = `${time} · 제일 많이 되는 날로 정해요`; }
$('unit').textContent = `${C.complex} ${C.unit}`;
$('road').textContent = C.road;
$('parking').textContent = C.parking;
$('menu').textContent = C.menu;
const m = RSVP.maps(); $('kakaoMap').href = m.kakao; $('naverMap').href = m.naver;
$('copyAddr').onclick = () => RSVP.copy(RSVP.address()).then(() => toast('주소를 복사했어요'));
$('copyLink').onclick = () => RSVP.copy(location.href).then(() => toast('링크를 복사했어요'));
RSVPUI.mount({ form: $('form'), results: $('results'), labels: { submit: '이렇게 보낼게요' } });
</script>
</body>
</html>
