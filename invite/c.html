<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밍짜네 집들이 초대장</title>
<meta property="og:title" content="[알림] 밍짜네 집들이 개최 안내">
<meta property="og:description" content="입주민(밍짜네)이 알려드립니다. 친구분들은 빠짐없이 참석 바랍니다.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{--wall:#cdbf9f; --paper:#fffdf7; --ink:#191917; --ink-2:#66625a; --line:#1f1f1d; --no:#d42a1e; --blue:#1f3f8f}
*{box-sizing:border-box}
html,body{margin:0; overflow-x:hidden}
body{
  background:var(--wall); color:var(--ink);
  font-family:'IBM Plex Sans KR',system-ui,'Apple SD Gothic Neo',sans-serif; font-size:14.5px; line-height:1.6; word-break:keep-all;
  padding:30px 16px 40px;
  background-image:radial-gradient(rgba(90,70,40,.18) 1px,transparent 1.4px); background-size:7px 7px;
}
.notice{max-width:420px; margin:0 auto; background:var(--paper); position:relative; padding:34px 22px 0; box-shadow:0 2px 0 rgba(0,0,0,.08),0 14px 30px rgba(60,40,10,.25)}
.tape{position:absolute; top:-12px; width:86px; height:26px; background:rgba(245,236,200,.75); box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tape.l{left:-16px; transform:rotate(-28deg)} .tape.r{right:-16px; transform:rotate(26deg)}
.head{border:3px solid var(--line); padding:14px 10px 12px; text-align:center}
.head .tag{font-family:'Black Han Sans',sans-serif; font-size:44px; letter-spacing:.5em; padding-left:.5em; line-height:1.1; margin:0}
.head h1{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:22px; margin:6px 0 0}
.lead{font-family:'Nanum Myeongjo',serif; font-size:15px; line-height:1.75; margin:22px 0 0}

h2{font-size:15px; font-weight:700; margin:26px 0 10px; display:flex; gap:8px; align-items:baseline}
h2 .n{font-family:'Black Han Sans',sans-serif; font-weight:400; color:var(--blue); font-size:17px}

.ban{border-top:2px solid var(--line); border-bottom:2px solid var(--line); margin:0; padding:0; list-style:none}
.ban li{padding:14px 0 13px; display:grid; grid-template-columns:auto 1fr; column-gap:12px; align-items:baseline}
.ban li + li{border-top:1px solid #d8d3c6}
.ban .no{font-family:'Black Han Sans',sans-serif; color:var(--no); font-size:38px; line-height:.9}
.ban b{font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:25px; line-height:1.15; letter-spacing:-.01em}
.ban li > span:not(.no){grid-column:2; font-size:13px; color:var(--ink-2)}

table{width:100%; border-collapse:collapse; font-size:14px}
th,td{border:1px solid var(--line); padding:9px 10px; text-align:left; vertical-align:top}
th{width:74px; background:#f2eee3; font-weight:600}
td small{display:block; color:var(--ink-2); font-size:12.5px}
.acts{display:flex; gap:6px; margin-top:10px}
.acts a,.acts button{flex:1; min-height:42px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font:inherit; font-size:13px; font-weight:600; text-decoration:none; display:flex; align-items:center; justify-content:center; cursor:pointer}
.acts a:active,.acts button:active{background:#f2eee3}

.coop{margin:0; padding-left:18px; font-size:14px}
.coop li{margin:4px 0}

.sign{font-family:'Nanum Myeongjo',serif; text-align:center; margin:34px 0 0; position:relative}
.sign .date{font-size:14px; margin:0}
.sign .who{font-weight:800; font-size:20px; margin:6px 0 0; letter-spacing:.15em}
.seal{
  position:absolute; right:-4px; bottom:-16px; width:56px; height:56px; border-radius:50%;
  border:2.5px solid var(--no); color:var(--no); display:flex; align-items:center; justify-content:center;
  font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:15px; line-height:1.05; text-align:center;
  transform:rotate(-12deg); opacity:.82
}

.tabs{margin:30px -22px 0; border-top:2px dashed #a49d8c; display:grid; grid-template-columns:repeat(5,1fr)}
.tabs a{
  writing-mode:vertical-rl; text-orientation:mixed; display:flex; align-items:center; justify-content:center;
  height:132px; border-right:1px dashed #a49d8c; color:var(--ink); text-decoration:none; font-size:12.5px; font-weight:600; letter-spacing:.06em;
  transition:transform .2s;
}
.tabs a:last-child{border-right:0}
.tabs a b{color:var(--no)}
.tabs a:active{transform:translateY(6px) rotate(3deg)}
.tabhint{text-align:center; font-size:12px; color:var(--ink-2); margin:12px 0 0; padding-bottom:14px}
.toast{position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 16px; font-size:13px; transition:.25s; pointer-events:none}
.toast.show{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="notice">
  <span class="tape l"></span><span class="tape r"></span>
  <div class="head">
    <p class="tag">알림</p>
    <h1>밍짜네 집들이 초대장</h1>
  </div>
  <p class="lead">친구 여러분 안녕하십니까. 저희 밍짜네가 새 집에 입주하였기에 아래와 같이 집들이를 개최하오니, 바쁘시더라도 꼭 참석하여 주시기 바랍니다.</p>

  <h2><span class="n">01</span>금지 사항</h2>
  <ul class="ban">
    <li><span class="no">No!</span><b>집들이 선물</b><span>두 손은 가볍게, 추억은 무겁게</span></li>
    <li><span class="no">No!</span><b>수 아들</b><span>마음도 편하게</span></li>
    <li><span class="no">No!</span><b>칼부림</b><span>이번 집에 러그는 없어요</span></li>
  </ul>

  <h2><span class="n">02</span>개최 일시 및 장소</h2>
  <table>
    <tr><th>일시</th><td id="when"></td></tr>
    <tr><th>장소</th><td id="addr"></td></tr>
    <tr><th>주차</th><td id="park"></td></tr>
  </table>
  <div class="acts">
    <a id="kakaoMap" target="_blank" rel="noopener">카카오맵</a>
    <a id="naverMap" target="_blank" rel="noopener">네이버지도</a>
    <button type="button" id="copyAddr">주소 복사</button>
  </div>

  <h2><span class="n">03</span>협조 사항</h2>
  <ol class="coop" id="coop"></ol>

  <div class="sign">
    <p class="date" id="signDate"></p>
    <p class="who">밍짜네 입주민 일동</p>
    <span class="seal">밍짜<br>之印</span>
  </div>

  <nav class="tabs" id="tabs" aria-label="참석 여부 알리기"></nav>
  <p class="tabhint">↑ 하나 뜯어가세요 (누르면 문자로 연결돼요)</p>
</main>
<div class="toast" id="toast"></div>

<script>
/* ── 여기만 고치면 됩니다 ─────────────────────────── */
const INVITE = {
  date: '2027-03-06', start: '18:00', end: '22:00',
  address: '동탄 ○○아파트 ○○○동 ○○○○호',
  addrNote: '공동현관 호출 ○○○○',
  mapQuery: '동탄 ○○아파트',
  parking: '방문 차량 등록 필요',
  parkingNote: '차량번호를 미리 알려주시면 등록해 둡니다',
  coop: [
    '저녁 식사는 주최 측에서 준비합니다. 공복 상태로 오시기 바랍니다.',
    '늦으실 경우 미리 연락 바랍니다. 음식은 남겨둡니다.',
    '층간소음 방지를 위해 22시 이후 고성방가는 자제 바랍니다.',
  ],
  phone: '010-0000-0000',
};
/* ──────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const d = new Date(INVITE.date + 'T00:00:00');
const W = ['일','월','화','수','목','금','토'];
const ampm = t => { const [h,m] = t.split(':').map(Number); return (h<12?'오전 ':'오후 ') + ((h%12)||12) + '시' + (m?` ${m}분`:''); };
const sms = body => `sms:${INVITE.phone}${/iPhone|iPad/.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(body)}`;
$('when').innerHTML = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${W[d.getDay()]})<small>${ampm(INVITE.start)} ~ ${ampm(INVITE.end)}</small>`;
$('addr').innerHTML = `${INVITE.address}<small>${INVITE.addrNote}</small>`;
$('park').innerHTML = `${INVITE.parking}<small>${INVITE.parkingNote}</small>`;
$('coop').innerHTML = INVITE.coop.map(t => `<li>${t}</li>`).join('');
$('signDate').textContent = `${d.getFullYear()}. ${d.getMonth()+1}.`;
const TABS = [
  ['<b>참석</b> 합니다', '밍짜네 집들이 참석합니다! 이름: / 인원: '],
  ['<b>한 명</b> 더 데려감', '밍짜네 집들이 참석! 한 명 더 데려가도 될까? 이름: '],
  ['<b>차</b> 가져감', '밍짜네 집들이 차 가져가요. 차량번호: '],
  ['조금 <b>늦음</b>', '밍짜네 집들이 조금 늦을 것 같아요. 도착 예정: '],
  ['<b>못 감</b> ㅠㅠ', '이번 집들이는 못 갈 것 같아 ㅠㅠ 다음에 꼭 놀러갈게!'],
];
$('tabs').innerHTML = TABS.map(([l,b]) => `<a href="${sms(b)}">${l}</a>`).join('');
$('kakaoMap').href = 'https://map.kakao.com/link/search/' + encodeURIComponent(INVITE.mapQuery);
$('naverMap').href = 'https://map.naver.com/p/search/' + encodeURIComponent(INVITE.mapQuery);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
$('copyAddr').onclick = async () => {
  try { await navigator.clipboard.writeText(INVITE.address); }
  catch { const ta=document.createElement('textarea'); ta.value=INVITE.address; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('주소를 복사했어요');
};
</script>
</body>
</html>
